name: Deployment probe
# Anonymous, read-only requests to the published site: availability, HTTPS,
# security headers and, when the public browser key is configured as the
# repository variable TASKNADO_SUPABASE_PUBLISHABLE_KEY, the hosted Auth
# settings. A failed run is the alert: GitHub notifies the repository owner.
# No secret is used. See docs/SECURITY-OPERATIONS.md.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deployment-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Uses only Node.js built-ins: nothing is installed.
      - run: node scripts/probe-deployment.mjs
        env:
          TASKNADO_SITE_URL: ${{ vars.TASKNADO_SITE_URL || 'https://tasknado.netlify.app' }}
          TASKNADO_SUPABASE_PUBLISHABLE_KEY: ${{ vars.TASKNADO_SUPABASE_PUBLISHABLE_KEY }}
